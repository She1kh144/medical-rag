<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* === Reset & base === */
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, p, button, input, textarea {
      margin: 0; padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #0f172a;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 40px 48px;
    }

    /* === Header === */
    .header h1 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .header .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 32px;
    }

    /* === Form === */
    .form { display: flex; flex-direction: column; gap: 12px; }

    textarea {
      width: 100%;
      min-height: 80px;
      padding: 14px 18px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 6px;
      font-size: 15px;
      color: #0f172a;
      resize: vertical;
      font-family: inherit;
      line-height: 1.5;
    }
    textarea::placeholder { color: #94a3b8; }
    textarea:focus {
      outline: none;
      border-color: #1e40af;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
    }

    .submit-btn {
      align-self: flex-start;
      background: #1e40af;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .submit-btn:hover:not(:disabled) { background: #1e3a8a; }
    .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }

    /* === Answer area === */
    .answer-section {
      display: none;
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid #e5e7eb;
    }
    .answer-section.visible { display: block; }

    .answer-label {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .answer-text {
      color: #0f172a;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      margin-bottom: 20px;
      min-height: 24px;
    }

    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }
    .source-tag {
      font-size: 12px;
      color: #1e3a8a;
      background: #dbeafe;
      padding: 4px 12px;
      border-radius: 12px;
    }

    .disclaimer {
      color: #94a3b8;
      font-size: 12px;
      font-style: italic;
    }

    /* === Mobile === */
    @media (max-width: 640px) {
      body { padding: 20px 12px; }
      .container { padding: 24px 20px; border-radius: 6px; }
      .header h1 { font-size: 20px; }
      textarea { font-size: 16px; } /* 16px prevents iOS auto-zoom on focus */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Medical RAG</h1>
      <p class="subtitle">Справочная система по препаратам</p>
    </div>

    <form class="form" id="ask-form">
      <textarea
        id="query"
        placeholder="Задайте вопрос о препарате..."
        required
      ></textarea>
      <button type="submit" class="submit-btn" id="submit-btn">Спросить</button>
    </form>

    <div class="answer-section" id="answer-section">
      <p class="answer-label">Ответ</p>
      <p class="answer-text" id="answer-text"></p>
      <div class="sources" id="sources"></div>
      <p class="disclaimer">Это не медицинская консультация, обратитесь к врачу.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('ask-form');
    const queryEl = document.getElementById('query');
    const submitBtn = document.getElementById('submit-btn');
    const answerSection = document.getElementById('answer-section');
    const answerTextEl = document.getElementById('answer-text');
    const sourcesEl = document.getElementById('sources');

    queryEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = queryEl.value.trim();
      if (!query) return;

      // Reveal answer area, clear previous results, disable submit
      answerSection.classList.add('visible');
      answerTextEl.textContent = '';
      sourcesEl.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Поиск...';

      try {
        const response = await fetch('/ask/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          // Parse complete SSE messages from buffer
          let sepIndex;
          while ((sepIndex = buffer.indexOf('\n\n')) !== -1) {
            const rawMessage = buffer.slice(0, sepIndex);
            buffer = buffer.slice(sepIndex + 2);
            handleSSEMessage(rawMessage);
          }
        }
      } catch (err) {
        answerTextEl.textContent = `Ошибка: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Спросить';
      }
    });

    function handleSSEMessage(raw) {
      // Each message has lines like "event: token" and "data: ..."
      const lines = raw.split('\n');
      let event = 'message';
      let data = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) event = line.slice(7);
        else if (line.startsWith('data: ')) data = line.slice(6);
      }

      if (event === 'sources') {
        const sources = JSON.parse(data);
        // Deduplicate sources for cleaner display
        const unique = [...new Set(sources.map(s => s.source))];
        sourcesEl.innerHTML = unique
          .map(s => `<span class="source-tag">${s}</span>`)
          .join('');
      } else if (event === 'token') {
        // Unescape the newlines we escaped on the server
        const text = data.replace(/\\n/g, '\n');
        answerTextEl.textContent += text;
      }
      // 'done' event we just ignore — the finally block handles cleanup
    }
  </script>
</body>
</html>
