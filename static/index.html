<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical RAG</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <style>
    /* === Color variables === */
    :root {
      --bg-page: #f5f5f5;
      --bg-container: #ffffff;
      --bg-input: #f8fafc;
      --bg-source: #dbeafe;
      --bg-example-hover: #f8fafc;

      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --text-label: #94a3b8;
      --text-example: #475569;
      --text-footer: #64748b;
      --text-source: #1e3a8a;

      --border-default: #e5e7eb;
      --border-input: #cbd5e1;
      --border-footer-link: #cbd5e1;

      --accent: #1e40af;
      --accent-hover: #1e3a8a;
      --accent-focus-ring: rgba(30, 64, 175, 0.1);

      --btn-text: #ffffff;
      --btn-disabled-bg: #94a3b8;
    }

    :root.dark {
      --bg-page: #0f172a;
      --bg-container: #1e293b;
      --bg-input: #0f172a;
      --bg-source: #1e3a5f;
      --bg-example-hover: #233044;

      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --text-label: #64748b;
      --text-example: #cbd5e1;
      --text-footer: #94a3b8;
      --text-source: #93c5fd;

      --border-default: #334155;
      --border-input: #334155;
      --border-footer-link: #334155;

      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-focus-ring: rgba(59, 130, 246, 0.15);

      --btn-text: #f1f5f9;
      --btn-disabled-bg: #475569;
    }

    /* === Reset & base === */
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, p, button, input, textarea {
      margin: 0; padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 40px 20px;
      transition: background 0.2s, color 0.2s;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--bg-container);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      padding: 40px 48px;
      transition: background 0.2s, border-color 0.2s;
    }

    /* === Header === */
    .header h1 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .header .subtitle {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 32px;
    }

    /* === Theme toggle === */
    .header { position: relative; }
    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--border-default);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .theme-toggle:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .theme-toggle .icon-moon { display: none; }
    :root.dark .theme-toggle .icon-sun { display: none; }
    :root.dark .theme-toggle .icon-moon { display: inline-block; }

    /* === Form === */
    .form { display: flex; flex-direction: column; gap: 12px; }

    textarea {
      width: 100%;
      min-height: 80px;
      padding: 14px 18px;
      border: 1px solid var(--border-input);
      background: var(--bg-input);
      border-radius: 6px;
      font-size: 15px;
      color: var(--text-primary);
      resize: vertical;
      font-family: inherit;
      line-height: 1.5;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    textarea::placeholder { color: var(--text-muted); }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-focus-ring);
    }

    .submit-btn {
      align-self: flex-start;
      background: var(--accent);
      color: var(--btn-text);
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .submit-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .submit-btn:disabled { background: var(--btn-disabled-bg); cursor: not-allowed; }

    /* === Answer area === */
    .answer-section {
      display: none;
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid var(--border-default);
    }
    .answer-section.visible { display: block; }

    .answer-label {
      color: var(--text-label);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .answer-text {
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 20px;
      min-height: 24px;
    }
    .answer-text p { margin-bottom: 12px; }
    .answer-text p:last-child { margin-bottom: 0; }
    .answer-text strong { font-weight: 500; color: var(--text-primary); }
    .answer-text ul, .answer-text ol {
      margin: 8px 0 12px 24px;
    }
    .answer-text li { margin-bottom: 4px; }

    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }
    .source-tag {
      font-size: 12px;
      color: var(--text-source);
      background: var(--bg-source);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .disclaimer {
      color: var(--text-muted);
      font-size: 12px;
      font-style: italic;
    }

    /* === Mobile === */
    @media (max-width: 640px) {
      body { padding: 20px 12px; }
      .container { padding: 24px 20px; border-radius: 6px; }
      .header h1 { font-size: 20px; }
      textarea { font-size: 16px; }
    }

    /* === Loading indicator === */
    .loading-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .loading-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* === Example questions === */
    .examples {
      margin-top: 20px;
    }
    .examples-label {
      color: var(--text-label);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .example-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .example-item {
      text-align: left;
      background: none;
      border: 1px solid var(--border-default);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text-example);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .example-item:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--bg-example-hover);
    }

    /* === Footer === */
    .footer {
      max-width: 720px;
      margin: 20px auto 0;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .footer a {
      color: var(--text-footer);
      text-decoration: none;
      border-bottom: 1px solid var(--border-footer-link);
      padding-bottom: 1px;
      transition: color 0.15s;
    }
    .footer a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
      <h1>Medical RAG</h1>
      <p class="subtitle">Справочная система по препаратам</p>
    </div>

    <form class="form" id="ask-form">
      <textarea
        id="query"
        placeholder="Задайте вопрос о препарате..."
        required
      ></textarea>
      <button type="submit" class="submit-btn" id="submit-btn">Спросить</button>
    </form>

    <div class="examples" id="examples">
      <p class="examples-label">Примеры вопросов</p>
      <div class="example-list">
        <button class="example-item" type="button">Какая дозировка парацетамола для взрослых?</button>
        <button class="example-item" type="button">При каких заболеваниях противопоказан ибупрофен?</button>
        <button class="example-item" type="button">С какого возраста можно принимать лоратадин?</button>
        <button class="example-item" type="button">Какой период полувыведения у дезлоратадина?</button>
      </div>
    </div>

    <div class="answer-section" id="answer-section">
      <p class="answer-label">Ответ</p>
      <p class="answer-text" id="answer-text"></p>
      <div class="sources" id="sources"></div>
      <p class="disclaimer">Это не медицинская консультация, обратитесь к врачу.</p>
    </div>
  </div>

  <footer class="footer">
    <a href="https://github.com/She1kh144/medical-rag" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script>
    const form = document.getElementById('ask-form');
    const queryEl = document.getElementById('query');
    const submitBtn = document.getElementById('submit-btn');
    const answerSection = document.getElementById('answer-section');
    const answerTextEl = document.getElementById('answer-text');
    const sourcesEl = document.getElementById('sources');
    const examples = document.getElementById('examples');
    const exampleItems = document.querySelectorAll('.example-item');

    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;

    // Initialize theme: stored preference > system preference > light
    const storedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (storedTheme === 'dark' || (!storedTheme && systemPrefersDark)) {
      root.classList.add('dark');
    }

    themeToggle.addEventListener('click', () => {
      root.classList.toggle('dark');
      localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
    });

    let accumulatedAnswer = '';
    let firstTokenReceived = false;

    function renderMarkdown(markdown) {
      const renderedHtml = marked.parse(markdown);
      return DOMPurify.sanitize(renderedHtml);
    }

    function renderSources(sources) {
      const uniqueSources = [
        ...new Set(sources.map(source => source.source))
      ];

      const sourceTags = uniqueSources.map((source) => {
        const tag = document.createElement('span');
        tag.className = 'source-tag';
        tag.textContent = source;
        return tag;
      });

      sourcesEl.replaceChildren(...sourceTags);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = queryEl.value.trim();
      if (!query) return;

      // Reveal answer area, clear previous results, disable submit
      answerSection.classList.add('visible');
      examples.style.display = 'none';
      accumulatedAnswer = '';
      sourcesEl.replaceChildren();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Поиск...';

      // Show loading dots until first token arrives
      answerTextEl.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';
      firstTokenReceived = false;

      try {
        const response = await fetch('/ask/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        });

        if (!response.ok) {
          let detail = `HTTP ${response.status}`;
          try {
            const body = await response.json();
            if (typeof body.detail === 'string') detail = body.detail;
          } catch { /* no JSON body — keep the status */ }
          throw new Error(detail);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          // Parse complete SSE messages from buffer
          let sepIndex;
          while ((sepIndex = buffer.indexOf('\n\n')) !== -1) {
            const rawMessage = buffer.slice(0, sepIndex);
            buffer = buffer.slice(sepIndex + 2);
            handleSSEMessage(rawMessage);
          }
        }
      } catch (err) {
        answerTextEl.textContent = `Ошибка: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Спросить';
      }
    });

    // Keyboard: Enter to submit, Shift+Enter for newline
    queryEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // Click an example to populate and submit
    exampleItems.forEach((item) => {
      item.addEventListener('click', () => {
        queryEl.value = item.textContent;
        form.requestSubmit();
      });
    });

    function handleSSEMessage(raw) {
      // Each message has lines like "event: token" and "data: ..."
      const lines = raw.split('\n');
      let event = 'message';
      let data = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) event = line.slice(7);
        else if (line.startsWith('data: ')) data = line.slice(6);
      }

      if (event === 'sources') {
        const sources = JSON.parse(data);
        // Deduplicate sources for cleaner display
        renderSources(sources);
        } else if (event === 'token') {
          const text = data.replace(/\\n/g, '\n');
          if (!firstTokenReceived) {
            answerTextEl.replaceChildren();
            firstTokenReceived = true;
          }
          accumulatedAnswer += text;
          answerTextEl.innerHTML = renderMarkdown(accumulatedAnswer);
        }
      // 'done' event we just ignore — the finally block handles cleanup
    }
  </script>
</body>
</html>
